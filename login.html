<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід - TimerCountdown</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card">
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <span style="font-size: 48px;">⏰</span>
                            <h2 class="mt-2">TimerCountdown</h2>
                            <p class="text-muted">Вхід до системи</p>
                        </div>
                        
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" placeholder="your@email.com" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Пароль</label>
                                <input type="password" class="form-control" id="password" placeholder="••••••" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Увійти</button>
                        </form>
                        
                        <div id="message" class="mt-3"></div>
                        
                        <hr class="my-4">
                        
                        <div class="text-center">
                            <p class="mb-0">Ще немає акаунту? <a href="register.html" class="text-decoration-none">Зареєструватися</a></p>
                        </div>
                        
                        <div class="text-center mt-3">
                            <small class="text-muted">
                                <a href="about.html" class="text-decoration-none">ℹ️ Про додаток</a>
                            </small>
                        </div>
                    </div>
                </div>
                
                <!-- Демо-підказка -->
                <div class="alert alert-info mt-3 text-center">
                    <small>
                        <strong>Демо-дані:</strong> test@example.com / 123456
                    </small>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
