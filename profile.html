<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профіль - TimerCountdown</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container mt-4">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0">
                    <span style="font-size: 1.5rem;">👤</span> 
                    Профіль користувача
                </h3>
            </div>
            <div class="card-body">
                <!-- Таблиця з даними користувача -->
                <div class="table-responsive">
                    <table class="table table-bordered table-hover">
                        <tbody>
                            <tr>
                                <th style="width: 200px; background-color: #f8f9fa;">ID користувача</th>
                                <td id="profileId">—</td>
                            </tr>
                            <tr>
                                <th style="background-color: #f8f9fa;">Ім'я</th>
                                <td id="profileName">—</td>
                            </tr>
                            <tr>
                                <th style="background-color: #f8f9fa;">Email</th>
                                <td id="profileEmail">—</td>
                            </tr>
                            <tr>
                                <th style="background-color: #f8f9fa;">Стать</th>
                                <td id="profileGender">—</td>
                            </tr>
                            <tr>
                                <th style="background-color: #f8f9fa;">Дата народження</th>
                                <td id="profileDob">—</td>
                            </tr>
                            <tr>
                                <th style="background-color: #f8f9fa;">Дата реєстрації</th>
                                <td id="profileRegisteredAt">—</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <!-- Контейнер для повідомлень -->
                <div id="profileMessage"></div>
                
                <!-- Контейнер для кнопки повернення -->
                <div id="backButtonContainer" class="text-center mt-4"></div>
            </div>
        </div>
        
        <!-- Додаткова інформація про таймери -->
        <div class="card mt-4">
            <div class="card-body">
                <h5 class="card-title">
                    <span>⏰</span> Статистика таймерів
                </h5>
                <div class="row text-center mt-3">
                    <div class="col-md-4">
                        <div class="border rounded p-3">
                            <div class="h2" id="totalTimersCount">0</div>
                            <div class="text-muted">Всього таймерів</div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="border rounded p-3">
                            <div class="h2 text-success" id="activeTimersCount">0</div>
                            <div class="text-muted">Активні</div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="border rounded p-3">
                            <div class="h2 text-warning" id="waitingTimersCount">0</div>
                            <div class="text-muted">Очікують</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
