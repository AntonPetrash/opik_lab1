<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація - TimerCountdown</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-primary text-white text-center">
                        <span style="font-size: 2rem;">⏰</span>
                        <h3 class="mb-0">TimerCountdown</h3>
                        <small>Створення нового акаунту</small>
                    </div>
                    <div class="card-body">
                        <form id="registerForm">
                            <!-- Ім'я -->
                            <div class="mb-3">
                                <label for="name" class="form-label">
                                    <span>👤</span> Ім'я
                                </label>
                                <input type="text" class="form-control" id="name" 
                                       placeholder="Іван Петренко" required>
                                <div class="form-text">Введіть ваше повне ім'я</div>
                            </div>
                            
                            <!-- Email -->
                            <div class="mb-3">
                                <label for="email" class="form-label">
                                    <span>📧</span> Email
                                </label>
                                <input type="email" class="form-control" id="email" 
                                       placeholder="ivan@example.com" required>
                                <div class="form-text">Введіть дійсну email адресу</div>
                            </div>
                            
                            <!-- Стать -->
                            <div class="mb-3">
                                <label for="gender" class="form-label">
                                    <span>⚥</span> Стать
                                </label>
                                <select class="form-select" id="gender" required>
                                    <option value="">Виберіть</option>
                                    <option value="Чоловіча">Чоловіча</option>
                                    <option value="Жіноча">Жіноча</option>
                                    <option value="Інша">Інша</option>
                                </select>
                            </div>
                            
                            <!-- Дата народження -->
                            <div class="mb-3">
                                <label for="dob" class="form-label">
                                    <span>🎂</span> Дата народження
                                </label>
                                <input type="date" class="form-control" id="dob" required>
                                <div class="form-text">Ви повинні бути старшими 18 років</div>
                            </div>
                            
                            <!-- Пароль -->
                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    <span>🔒</span> Пароль
                                </label>
                                <input type="password" class="form-control" id="password" 
                                       placeholder="Мінімум 4 символи" required>
                                <div class="form-text">Пароль повинен містити не менше 4 символів</div>
                            </div>
                            
                            <!-- Підтвердження пароля -->
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">
                                    <span>✓</span> Підтвердіть пароль
                                </label>
                                <input type="password" class="form-control" id="confirmPassword" 
                                       placeholder="Введіть пароль ще раз" required>
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100">
                                Зареєструватися
                            </button>
                        </form>
                        
                        <!-- Контейнер для повідомлень -->
                        <div id="registerMessage" class="mt-3"></div>
                        
                        <hr class="my-4">
                        
                        <div class="text-center">
                            <p class="mb-0">
                                Вже маєте акаунт? 
                                <a href="login.html" class="text-decoration-none">Увійти</a>
                            </p>
                        </div>
                        
                        <div class="text-center mt-3">
                            <small class="text-muted">
                                <a href="about.html" class="text-decoration-none">ℹ️ Про додаток</a>
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
