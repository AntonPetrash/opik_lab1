<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мої таймери - TimerCountdown</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container mt-4">
        <!-- Заголовок сторінки -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="display-6">
                    <span>⏰</span> Мої таймери
                </h1>
                <p class="text-muted">Керуйте часом ефективно</p>
            </div>
            <button class="btn btn-primary btn-lg" onclick="openModal()">
                + Створити таймер
            </button>
        </div>
        
        <!-- Статистика таймерів -->
        <div class="row mb-4" id="statsContainer">
            <div class="col-md-3">
                <div class="card text-center bg-primary text-white">
                    <div class="card-body">
                        <div class="h2" id="totalCount">0</div>
                        <div>Всього таймерів</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center bg-success text-white">
                    <div class="card-body">
                        <div class="h2" id="activeCount">0</div>
                        <div>Активні</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center bg-warning text-dark">
                    <div class="card-body">
                        <div class="h2" id="waitingCount">0</div>
                        <div>Очікують</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center bg-secondary text-white">
                    <div class="card-body">
                        <div class="h2" id="completedCount">0</div>
                        <div>Завершено</div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Список таймерів -->
        <div id="timersList"></div>
    </div>
    
    <!-- Модальне вікно для створення/редагування таймера -->
    <div class="modal fade" id="timerModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="modalTitle">Створити таймер</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="timerId">
                    
                    <!-- Назва таймера -->
                    <div class="mb-3">
                        <label for="timerName" class="form-label">Назва таймера</label>
                        <input type="text" class="form-control" id="timerName" 
                               placeholder="Наприклад, Важлива зустріч" required>
                    </div>
                    
                    <!-- Дата та час старту -->
                    <div class="mb-3">
                        <label class="form-label">Час старту</label>
                        <div class="row">
                            <div class="col-md-6 mb-2 mb-md-0">
                                <input type="date" class="form-control" id="timerStartDate" required>
                            </div>
                            <div class="col-md-6">
                                <input type="time" class="form-control" id="timerStartTime" required>
                            </div>
                        </div>
                        <div class="form-text">Виберіть дату та час, коли таймер має розпочатися</div>
                    </div>
                    
                    <!-- Дата та час завершення -->
                    <div class="mb-3">
                        <label class="form-label">Час завершення</label>
                        <div class="row">
                            <div class="col-md-6 mb-2 mb-md-0">
                                <input type="date" class="form-control" id="timerEndDate" required>
                            </div>
                            <div class="col-md-6">
                                <input type="time" class="form-control" id="timerEndTime" required>
                            </div>
                        </div>
                        <div class="form-text">Виберіть дату та час завершення</div>
                    </div>
                    
                    <!-- Підказка -->
                    <div class="alert alert-info mt-3">
                        <small>
                            <strong>ℹ️ Підказка:</strong> Таймер автоматично змінюватиме статус:
                            "Очікує" → "Активний" → "Завершено"
                        </small>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Скасувати</button>
                    <button type="button" class="btn btn-primary" onclick="saveTimer()">Зберегти</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/timers.js"></script>
</body>
</html>
